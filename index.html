<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>Cyber Defenders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: an Among Us-style ship. Phones are the game (map, joystick, action buttons); the TV laptop
   runs the game, shows the game code, five security cameras and the full-screen meetings. */
:root {
  --bg: #05070d;
  --panel: #0f1e31;
  --panel-2: #142840;
  --line: #2d4961;
  --fg: #f0f6ff;
  --muted: #a3b8ce;
  --def: #54e5ed;
  --hack: #ff4d61;
  --ok: #43d16a;
  --warn: #ffcf5c;
  --focus: #ffd75e;
  --ink: #0b0f16;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 var(--font);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.ingame { overflow: hidden; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.def { color: var(--def); } .hack { color: var(--hack); } .ok { color: var(--ok); } .warn { color: var(--warn); }

/* ---------- menus (landing, join, lobby) ---------- */
.screen { max-width: 520px; margin: 0 auto; padding-block: 20px 48px; display: grid; gap: 14px; }
.brand { font-family: var(--mono); font-weight: 700; letter-spacing: .06em; font-size: 14px; color: var(--muted); }
.title { font-size: 44px; font-weight: 800; letter-spacing: .01em; line-height: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 20px; }
.label { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; padding: 12px 18px;
  border-radius: 14px; border: 3px solid var(--ink); background: #e8eef6; color: var(--ink); font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--ink); touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.btn.primary { background: var(--def); }
.btn.red { background: var(--hack); color: #fff; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); box-shadow: none; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 15px; width: auto; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > .btn { flex: 1 1 140px; }
input[type="text"] { width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: #0b1828; font-size: 20px; }
.crew-row { display: flex; flex-wrap: wrap; gap: 12px 14px; justify-content: center; }
.crew { display: grid; justify-items: center; gap: 4px; width: 78px; text-align: center; font-weight: 700; font-size: 14px; }
.crew svg { width: 54px; height: auto; }
.crew span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
details.rules summary { cursor: pointer; padding: 14px 16px; font-weight: 700; }
details.rules ul { margin: 0; padding: 0 16px 16px 34px; display: grid; gap: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 60;
  max-width: min(440px, calc(100% - 32px)); background: #eef6ff; color: #081321; border-radius: 12px; padding: 10px 16px; font-weight: 700; box-shadow: 0 8px 30px #0008; text-align: center; }
.toast.bad { background: #ffd2d8; }
.conn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--warn); color: #2b1d00; padding: 6px 14px; border-radius: 10px; font-weight: 800; }
.join-url { font-family: var(--mono); font-weight: 700; font-size: clamp(18px, 2vw, 36px); color: var(--fg); overflow-wrap: anywhere; }
.code-in { font-family: var(--mono); font-weight: 700; font-size: 30px; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.code-row { display: flex; gap: 2.4vw; align-items: center; flex-wrap: wrap; }
.code-big { font-family: var(--mono); font-weight: 700; font-size: clamp(40px, 4.8vw, 120px); letter-spacing: .14em; line-height: 1; color: var(--def); }
.code-chip { font-family: var(--mono); font-weight: 700; letter-spacing: .12em; color: var(--def); }
.field-err { color: var(--warn); font-weight: 700; }
.crew .you { color: var(--def); font-size: 12px; font-weight: 800; }
.crew.me svg { filter: drop-shadow(0 0 6px var(--def)); }
.conn { pointer-events: none; }
body.tv .conn { top: 12px; bottom: auto; font-size: clamp(16px, 1.6vw, 30px); padding: 8px 18px; }

/* ---------- game layer (phone) ---------- */
.game { position: fixed; inset: 0; z-index: 5; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; }
.game canvas.world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud-top { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.taskbar { flex: 1 1 auto; max-width: 380px; background: rgba(8, 19, 33, .82); border: 2px solid #1d2f44; border-radius: 10px; padding: 5px 10px 7px; }
.taskbar .lbl { font-family: var(--mono); font-size: 11px; color: #cfe3f7; display: flex; justify-content: space-between; }
.bar { height: 12px; border-radius: 6px; background: #12301f; overflow: hidden; border: 1px solid #0b0f16; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .5s; }
.hud-btn { min-width: 48px; min-height: 48px; border-radius: 12px; border: 2px solid #0b0f16; background: rgba(232, 238, 246, .92); color: var(--ink); font-weight: 900; font-size: 13px; cursor: pointer; padding: 4px 10px; }
.tasks { position: absolute; left: calc(8px + env(safe-area-inset-left, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); max-width: min(270px, 60vw);
  background: rgba(8, 19, 33, .78); border-radius: 10px; border: 2px solid #1d2f44; font-size: 13px; }
.tasks summary { cursor: pointer; padding: 6px 10px; font-weight: 800; list-style: none; }
.tasks summary::-webkit-details-marker { display: none; }
.tasks ul { list-style: none; margin: 0; padding: 0 10px 8px; display: grid; gap: 3px; }
.tasks li.done { color: var(--ok); }
.tasks li.done::before { content: "\2713  "; }
.tasks .fake { color: var(--hack); font-weight: 800; }
.banner { position: absolute; left: 50%; transform: translateX(-50%); top: calc(66px + env(safe-area-inset-top, 0px)); z-index: 2; max-width: calc(100% - 24px);
  padding: 8px 14px; border-radius: 10px; font-weight: 900; text-align: center; pointer-events: none; }
.banner.crit { background: #b3122e; color: #fff; animation: flash 1s steps(2) infinite; }
.banner.lights { background: #3a2a05; color: var(--warn); border: 2px solid var(--warn); }
.banner.ghost { background: rgba(8, 19, 33, .85); color: #cfe3f7; border: 2px solid #2d4961; top: auto; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
@keyframes flash { 50% { background: #5a0715; } }
.joy { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px;
  border-radius: 50%; background: rgba(255, 255, 255, .06); border: 2px solid rgba(255, 255, 255, .18); touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: rgba(255, 255, 255, .32); border: 2px solid rgba(255, 255, 255, .5); }
.actions { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(2, 84px); gap: 10px; }
.act { position: relative; width: 84px; height: 84px; border-radius: 22px; border: 3px solid var(--ink); background: #e8eef6; color: var(--ink);
  font-weight: 900; font-size: 13px; line-height: 1.1; cursor: pointer; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; padding: 4px; touch-action: manipulation; }
.act:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.act[disabled] { opacity: .32; cursor: default; }
.act .ico { font-size: 26px; line-height: 1; display: block; }
.act.use { background: #e8eef6; } .act.report { background: var(--warn); } .act.kill { background: var(--hack); color: #fff; }
.act.sab { background: #ff9f6b; } .act.vent { background: #c792ff; }
.act .cd { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; border-radius: 20px; background: rgba(0, 0, 0, .35); }
.minimap { position: absolute; inset: 0; z-index: 3; background: rgba(3, 6, 12, .9); display: grid; place-items: center; padding: calc(60px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px)); }
.minimap canvas { width: 100%; height: 100%; max-width: 1100px; }
.sabmenu { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(200px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  display: grid; gap: 8px; background: rgba(8, 19, 33, .95); border: 2px solid var(--hack); border-radius: 14px; padding: 10px; width: 230px; }

/* overlays: role reveal, meeting, results, end */
.overlay { position: fixed; inset: 0; z-index: 20; overflow: auto; background: radial-gradient(circle at 50% 30%, #13233a, #04060b 70%);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .inner { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; justify-items: center; text-align: center; }
.overlay .big { font-size: clamp(36px, 11vmin, 88px); font-weight: 800; letter-spacing: .02em; line-height: 1; }
.overlay .sub { font-size: clamp(18px, 4.5vw, 26px); }
.shh { font-size: clamp(44px, 14vmin, 110px); font-weight: 800; font-style: italic; }
.meeting { width: 100%; background: #b9c8da; color: var(--ink); border: 4px solid var(--ink); border-radius: 20px; padding: 14px; display: grid; gap: 12px; text-align: left; }
.meeting h2 { font-size: 24px; text-align: center; }
.meeting .why { text-align: center; font-weight: 700; }
.meeting .btn.ghost { color: var(--ink); border-color: var(--ink); }
.voters { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.voter { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 6px 10px; border-radius: 12px; background: #e8eef6; border: 3px solid var(--ink); font-weight: 800; color: var(--ink); text-align: left; width: 100%; cursor: pointer; }
.voter svg { width: 34px; flex: none; }
.voter .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.voter .stamp { margin-left: auto; font-size: 11px; font-weight: 900; background: var(--hack); color: #fff; padding: 2px 6px; border-radius: 6px; transform: rotate(-6deg); }
.voter.out { background: #8d9aab; text-decoration: line-through; cursor: default; }
.voter[aria-pressed="true"] { outline: 4px solid #0b5cff; outline-offset: 0; }
.voter.me { box-shadow: inset 0 0 0 2px #0b5cff; }
.timer { font-family: var(--mono); font-weight: 700; text-align: center; }
.lineup { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.lineup svg { width: 64px; }

/* ---------- mini-game sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; background: #020810e6; display: grid; align-items: center; justify-items: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 480px; max-height: 100%; overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 22px; }
.game-area { position: relative; border-radius: 14px; background: #06101c; border: 1px solid var(--line); padding: 14px; min-height: 240px; touch-action: manipulation; }
.wires { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 48%; position: relative; }
.wires svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { min-height: 52px; border-radius: 10px; border: 3px solid currentColor; background: #0b1828; font-weight: 800; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
.node.sel { background: currentColor; } .node.sel span { color: var(--ink); } .node.done { opacity: .55; cursor: default; }
.breakers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.breaker { min-height: 110px; border-radius: 10px; border: 2px solid var(--line); background: #0b1828; cursor: pointer; display: grid; align-content: space-between; justify-items: center; padding: 8px 4px; font-family: var(--mono); font-size: 13px; }
.breaker i { width: 70%; height: 42px; border-radius: 8px; background: #3a1b22; border: 2px solid var(--hack); display: block; }
.breaker[aria-pressed="true"] i { background: var(--ok); border-color: var(--ok); }
.clean { position: relative; height: 280px; overflow: hidden; }
.bug { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: none; background: radial-gradient(circle at 40% 35%, #c9a27a, #7a4a22 60%, #3d230f); cursor: pointer; color: #fff; font-weight: 800; }
canvas.wave { width: 100%; height: 160px; display: block; border-radius: 10px; background: #06101c; }
input[type="range"] { width: 100%; height: 44px; accent-color: var(--ok); }
.progress-big { height: 26px; border-radius: 99px; background: #172f47; overflow: hidden; }
.progress-big > i { display: block; height: 100%; width: 0; background: var(--def); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--line); background: #0b1828; font-family: var(--mono); font-size: 20px; cursor: pointer; }
.key.lit { background: var(--def); color: var(--ink); border-color: var(--def); }
.key.ok { background: var(--ok); color: var(--ink); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- TV ---------- */
body.tv { overflow: hidden; }
.tvwrap { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 1.4vh; padding-block: max(1.4vh, env(safe-area-inset-top, 0px)) max(1.4vh, env(safe-area-inset-bottom, 0px)); }
.tvbar { display: flex; align-items: center; gap: 12px; }
.tvbar .spacer { flex: 1; }
.tvgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1.2vh 1vw; min-height: 0; }
.cam { position: relative; border: 3px solid #1d2f44; border-radius: 14px; overflow: hidden; background: #000; min-height: 0; }
.cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam .tag { position: absolute; left: 10px; top: 8px; font-family: var(--mono); font-weight: 700; font-size: clamp(12px, 1.1vw, 20px); background: rgba(0, 0, 0, .6); padding: 2px 8px; border-radius: 6px; }
.cam .rec { position: absolute; right: 10px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: #ff2e45; animation: flash 1.2s steps(2) infinite; }
.status { background: linear-gradient(180deg, #0b2533, var(--panel)); border: 3px solid var(--def); border-radius: 14px; padding: 1.6vh 1.2vw; display: grid; align-content: space-between; gap: 1vh; min-height: 0; }
.status h3 { font-size: clamp(16px, 1.7vw, 32px); color: var(--def); }
.status .stat-big { font-size: clamp(36px, 5vw, 96px); font-weight: 800; line-height: 1; color: var(--ok); }
.status .bar { height: clamp(12px, 1.6vh, 22px); }
.status p { font-size: clamp(14px, 1.3vw, 24px); }
.takeover { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; text-align: center; padding: 3vh 3vw; background: radial-gradient(circle at 50% 35%, #13233a, #04060b 70%); overflow: auto; }
.takeover .inner { display: grid; gap: 2.2vh; justify-items: center; width: min(1500px, 100%); }
.takeover .big { font-size: clamp(48px, 8vw, 170px); font-weight: 800; line-height: 1; }
.takeover .sub { font-size: clamp(20px, 2.4vw, 46px); }
.takeover .note { font-size: clamp(16px, 1.5vw, 28px); color: var(--muted); }
.takeover.alarm { background: radial-gradient(circle at 50% 40%, #7a1424, #2a0610 60%, #12040a); }
.takeover .meeting { max-width: 1300px; }
.takeover .meeting h2 { font-size: clamp(24px, 2.6vw, 52px); }
.takeover .meeting .why, .takeover .meeting .timer { font-size: clamp(16px, 1.7vw, 32px); }
.takeover .voters { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.takeover .voter { font-size: clamp(16px, 1.5vw, 28px); min-height: 7vh; }
.takeover .voter svg { width: clamp(30px, 2.6vw, 52px); }
.takeover .lineup svg { width: clamp(60px, 7vw, 130px); }
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 3vw; align-items: start; min-height: 0; overflow: auto; }
.lobby h1 { font-size: clamp(40px, 6vw, 110px); font-weight: 800; line-height: 1; }
.qr { background: #fff; padding: 14px; border-radius: 16px; width: min(28vw, 44vh); }
.qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.lobby .crew { width: 110px; font-size: clamp(14px, 1.2vw, 20px); }
.lobby .crew svg { width: 70px; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.settings label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.settings select { min-height: 44px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 6px 10px; }
.foot { color: var(--muted); font-size: clamp(12px, 1vw, 18px); }
.lobby h1 { font-size: clamp(34px, 4.4vw, 84px); }
.code-row .qr { width: min(15vw, 30vh); flex: none; padding: 10px; }
.lobby .join-url { font-size: clamp(16px, 1.6vw, 30px); }
@media (max-width: 760px) {
  .code-row .qr { width: min(60vw, 280px); }
  body.tv { overflow: auto; }
  .tvwrap { height: auto; min-height: 100vh; }
  .lobby { grid-template-columns: 1fr; }
  .qr { width: min(70vw, 320px); }
  .tvgrid { grid-template-columns: 1fr 1fr; grid-template-rows: none; grid-auto-rows: 34vh; }
}
@media (prefers-reduced-motion: reduce) {
  .banner.crit, .cam .rec { animation: none; }
  .bar > i { transition: none; }
}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:24px 0">Loading Cyber Defenders…</p></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="alert" class="sr" role="alert"></div>

<script src="qrcode.js"></script>
<script src="mqtt.min.js"></script>
<script>
'use strict';
// The TV laptop presses "Host a game on this screen" (its address then ends in ?tv=CODE);
// phones open the address in the QR code (it ends in #CODE) or type the code.
let IS_TV = false;
const CANVAS_FONT = '"Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;

    g.fillRect((s.x - 0.55) * u, (s.y - 0.45) * u, 1.1 * u, 0.9 * u); g.strokeRect((s.x - 0.55) * u, (s.y - 0.45) * u, 1.1 * u, 0.9 * u);
    g.fillStyle = '#2f8fa0'; g.fillRect((s.x - 0.4) * u, (s.y - 0.32) * u, 0.8 * u, 0.42 * u);
  }
  for (const f of Object.values(FIXES)) {
    g.fillStyle = '#2a1820'; g.strokeStyle = '#0b0f16'; g.lineWidth = 3;
    g.fillRect((f.x - 0.5) * u, (f.y - 0.5) * u, u, u); g.strokeRect((f.x - 0.5) * u, (f.y - 0.5) * u, u, u);
    g.fillStyle = '#b3122e'; g.fillRect((f.x - 0.3) * u, (f.y - 0.3) * u, 0.6 * u, 0.25 * u);
  }
  for (const v of VENTS) {
    g.fillStyle = '#10161e'; g.strokeStyle = '#556678'; g.lineWidth = 3;
    g.fillRect((v.x - 0.55) * u, (v.y - 0.35) * u, 1.1 * u, 0.7 * u); g.strokeRect((v.x - 0.55) * u, (v.y - 0.35) * u, 1.1 * u, 0.7 * u);
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo((v.x - 0.55 + i * 0.275) * u, (v.y - 0.35) * u); g.lineTo((v.x - 0.55 + i * 0.275) * u, (v.y + 0.35) * u); g.stroke(); }
  }
  MAPIMG = c;
}

/* =========================================================================
   App state
   ========================================================================= */
const DEFAULTS = { killCd: 25, disc: 15, vote: 60, tasks: 4, meetings: 1 };
const MIN_PLAYERS = 4, MAX_PLAYERS = 10;
const BOT_NAMES = ['Byte', 'Pixel', 'Nova', 'Echo', 'Cipher', 'Vector', 'Delta', 'Orbit', 'Kilo'];
const App = {
  role: null,            // 'host' (TV) | 'player'
  pid: null, name: '',
  pub: null, skew: 0, priv: null,
  live: {},              // pid -> {x, y, d, m, hide}: where each phone's crewmate is
  bots: null,            // practice bots' positions, sent by the TV
  hostOnline: false, offline: false,
  ui: { revealed: false, voteSel: null, sound: false, map: false, sabMenu: false, confirm: null },
  booted: false,
};
const now = () => Date.now() + App.skew;
const me = () => App.pub && App.pub.players.find(p => p.pid === App.pid);
const playerBy = pid => App.pub && App.pub.players.find(p => p.pid === pid);
const nameOf = pid => (playerBy(pid) || {}).name || 'Someone';
const inRound = pub => !!pub && ['reveal', 'play', 'meeting', 'result', 'end'].includes(pub.phase);

/* =========================================================================
   Host engine (TV laptop, or this device in solo practice). The only place
   where roles live in the clear.
   ========================================================================= */
const Host = {
  active: false, solo: false, hs: null, S: null, v: 0, joinUrl: null, sentPriv: {},
  bots: {}, tickTimer: 0, botTimer: 0, committing: false, dirty: false, commitDone: null, lastBotPres: '', lastBotAt: 0,

  fresh() {
    return { roles: {}, life: {}, confirmed: {}, tasks: {}, meetingsLeft: {}, bodies: [], notes: {}, lastSeq: {}, killer: {},
      progress: 0, total: 0, killReadyAt: 0, sabReadyAt: 0, sab: null, meeting: null, result: null, end: null, revealEnds: 0, spawn: 0 };
  },
  begin(opts = {}) {
    this.active = true;
    this.solo = !!opts.solo;
    App.role = this.solo ? 'player' : 'host';
    if (!this.solo) document.body.classList.add('tv');
    App.skew = 0;
    const saved = opts.saved;
    if (saved && saved.S && saved.S.phase !== 'closed') { this.hs = saved.hs; this.S = saved.S; this.v = saved.v || 1; }
    else { this.hs = rid(10); this.v = 0; this.S = { gid: rid(8), phase: 'lobby', settings: { ...DEFAULTS }, players: [], kicked: {}, ...this.fresh() }; App.live = {}; App.bots = null; }
    this.sentPriv = {};
    clearInterval(this.tickTimer); clearInterval(this.botTimer);
    this.tickTimer = setInterval(() => this.tick(), 250);
    this.botTimer = setInterval(() => this.botStep(), 50);
    keepAwake();
    if (this.solo) {
      this.S.players = [{ pid: App.pid, name: App.name || 'You', seat: 0 }];
      for (let i = 0; i < 4; i++) this.addBot(true);
      this.start();
      return;
    }
    if (saved) this.placeBots();
    return this.commit();
  },
  stop(message, kind) {
    const wasTV = this.active && !this.solo;
    this.active = false; this.solo = false;
    clearInterval(this.tickTimer); clearInterval(this.botTimer);
    document.body.classList.remove('tv');
    App.role = 'player';
    App.pub = null; App.priv = null;
    if (wasTV) {
      Net.stop();
      // a reload now goes to the start page, not back into this game
      const q = new URLSearchParams(location.search);
      q.delete('tv');
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    }
    if (message) { App.tvNote = { text: message, kind: kind || 'closed' }; toast(message); }
    render();
  },
  // kept on this laptop, so reloading the TV page carries on with the same game
  save() { if (!this.solo && this.S) store.set('host', { code: Net.code, hs: this.hs, S: this.S, v: this.v, peers: Net.peerPubs(), at: Date.now() }); },

  // ---- inputs from phones (through the server) ----
  onMessage(m) {
    if (m.t === 'join') this.onJoin(m.pid, m.name);
    else if (m.t === 'leave') this.leave(m.pid);
    else if (m.t === 'act' && m.a && typeof m.a === 'object' && typeof m.a.t === 'string') { if (m.a.gid === this.S.gid) this.handle(m.pid, m.a); }
    else if (m.t === 'pos' && typeof m.pid === 'string') App.live[m.pid] = m.p;
    else if (m.t === 'replaced') this.stop('This game moved to another tab on this laptop.', 'replaced');
  },
  onJoin(pid, rawName) {
    const S = this.S;
    if (typeof pid !== 'string' || S.phase !== 'lobby') return;
    if (S.kicked && Date.now() - (S.kicked[pid] || 0) < 20000) return;   // just removed by the host
    const name = cleanName(rawName);
    if (!name) return;
    const p = S.players.find(x => x.pid === pid);
    if (p) { if (p.name !== name) { p.name = this.uniqueName(name, pid); this.commit(); } return; }
    if (S.players.length >= MAX_PLAYERS) return;
    S.players.push({ pid, name: this.uniqueName(name, pid), seat: S.players.length });
    this.commit();
  },
  leave(pid) {
    const S = this.S;
    if (S.phase !== 'lobby') return;
    const i = S.players.findIndex(p => p.pid === pid);
    if (i >= 0) { S.players.splice(i, 1); this.reseat(); this.commit(); }
  },
  uniqueName(name, pid) {
    const taken = new Set(this.S.players.filter(p => p.pid !== pid).map(p => p.name.toLowerCase()));
    if (!taken.has(name.toLowerCase())) return name;
    for (let n = 2; ; n++) { const c = `${name.slice(0, 11)} ${n}`; if (!taken.has(c.toLowerCase())) return c; }
  },
  reseat() { this.S.players.forEach((p, i) => { p.seat = i; }); },
  posOf(pid) {
    if (this.actorAt && this.actorAt.pid === pid) return this.actorAt;
    const p = this.S.players.find(x => x.pid === pid);
    if (!p) return null;
    if (p.bot) return this.bots[pid] ? this.bots[pid].pos : null;
    if (this.solo && pid === App.pid) return Local.pos;
    const l = App.live[pid];
    return l && Number.isFinite(l.x) && Number.isFinite(l.y) ? { x: l.x, y: l.y } : null;
  },
  near(pid, pt, range) { const p = this.posOf(pid); return !p || dist(p, pt) <= range + 1.6; },

  // ---- rules ----
  // the phone says where it stood when it acted, under its own key (positions on the shared channel can be faked)
  handle(pid, a) {
    const at = a && a.at;
    this.actorAt = at && Number.isFinite(at.x) && Number.isFinite(at.y) ? { pid, x: at.x, y: at.y } : null;
    try { this.handleAct(pid, a); } finally { this.actorAt = null; }
  },
  handleAct(pid, a) {
    const S = this.S, t = Date.now();
    const p = S.players.find(x => x.pid === pid);
    if (!p) return;
    const role = S.roles[pid], alive = S.life[pid] === 'alive';
    const note = (who, text, kind) => { S.notes[who] = { id: rid(6), text, kind: kind || 'info' }; };
    const nm = id => (S.players.find(x => x.pid === id) || {}).name || 'Someone';
    switch (a.t) {
      case 'task': {
        if (S.phase !== 'play') return;
        const task = (S.tasks[pid] || [])[a.i];
        if (!task || task.done || !this.near(pid, STATION[task.st], RANGE.use)) return;
        task.done = true;
        if (role === 'defender') S.progress = Math.min(S.total, S.progress + 1);
        this.checkWin();
        break;
      }
      case 'fix':
        if (S.phase !== 'play' || !S.sab || S.sab.kind !== a.kind || !alive || !this.near(pid, FIXES[a.kind], RANGE.fix)) return;
        S.sab = null;
        break;
      case 'sabotage':
        if (S.phase !== 'play' || role !== 'hacker' || !alive || S.sab || t < S.sabReadyAt || !FIXES[a.kind]) return;
        S.sab = { kind: a.kind, endsAt: a.kind === 'firewall' ? t + 45000 : 0, at: t };
        S.sabReadyAt = t + 35000;
        break;
      case 'kill': {
        if (S.phase !== 'play' || role !== 'hacker' || !alive || t < S.killReadyAt) return;
        const tg = a.target;
        if (tg === pid || S.life[tg] !== 'alive' || S.roles[tg] !== 'defender') return;
        const tp = this.posOf(tg), kp = this.posOf(pid);
        if (tp && kp && dist(tp, kp) > RANGE.kill + 1.6) return;
        S.life[tg] = 'dead';
        S.killer[tg] = pid;
        const at = tp || kp || spawnPoint(0);
        S.bodies.push({ pid: tg, x: Math.round(at.x * 100) / 100, y: Math.round(at.y * 100) / 100 });
        S.killReadyAt = t + S.settings.killCd * 1000;
        note(tg, `You were compromised by ${nm(pid)}. You're a ghost now: stay silent, but keep doing tasks.`, 'bad');
        this.checkWin();
        break;
      }
      case 'report': {
        if (S.phase !== 'play' || !alive) return;
        const b = S.bodies.find(x => x.pid === a.body);
        if (!b || !this.near(pid, b, RANGE.report)) return;
        this.startMeeting('report', pid, b.pid);
        break;
      }
      case 'button':
        if (S.phase !== 'play' || !alive || !(S.meetingsLeft[pid] > 0) || (S.sab && S.sab.kind === 'firewall') || !this.near(pid, TABLE, RANGE.table)) return;
        S.meetingsLeft[pid]--;
        this.startMeeting('button', pid, null);
        break;
      case 'vote': {
        const M = S.meeting;
        if (S.phase !== 'meeting' || !alive || M.votes[pid] != null || t < M.voteFrom - 500) return;
        if (a.mid != null && a.mid !== M.voteFrom) return;   // a vote meant for an earlier meeting
        if (a.target !== 'skip' && S.life[a.target] !== 'alive') return;
        M.votes[pid] = a.target;
        if (S.players.filter(x => S.life[x.pid] === 'alive').every(x => M.votes[x.pid] != null)) this.endMeeting();
        break;
      }
      default: return;
    }
    this.commit();
  },
  aliveDefenders() { const S = this.S; return S.players.filter(p => S.roles[p.pid] === 'defender' && S.life[p.pid] === 'alive').length; },
  hackerAlive() { const S = this.S; return S.players.some(p => S.roles[p.pid] === 'hacker' && S.life[p.pid] === 'alive'); },
  checkWin() {
    const S = this.S;
    if (S.phase !== 'play') return;
    if (S.progress >= S.total) this.finish('defenders', 'tasks');
    else if (this.hackerAlive() && this.aliveDefenders() <= 1) this.finish('hacker', 'parity');
  },
  startMeeting(reason, by, body) {
    const S = this.S, t = Date.now();
    S.sab = null;
    S.players.forEach(p => { if (S.life[p.pid] === 'dead') S.confirmed[p.pid] = true; });
    S.bodies = [];
    S.meeting = { reason, by, body, voteFrom: t + S.settings.disc * 1000, endsAt: t + (S.settings.disc + S.settings.vote) * 1000, votes: {} };
    S.phase = 'meeting';
    Object.values(this.bots).forEach(b => { b.voteAt = 0; b.path = null; b.busyUntil = 0; b.goal = null; });
  },
  endMeeting() {
    const S = this.S, t = Date.now();
    const seat = id => (S.players.find(p => p.pid === id) || {}).seat || 0;
    const tally = {}; let skip = 0;
    for (const v of Object.values(S.meeting.votes)) { if (v === 'skip') skip++; else tally[v] = (tally[v] || 0) + 1; }
    const ranked = Object.entries(tally).sort((a, b) => b[1] - a[1] || seat(a[0]) - seat(b[0]));
    let ej = null, tie = false;
    if (ranked.length) { const [top, n] = ranked[0]; tie = ranked.length > 1 && ranked[1][1] === n; if (!tie && n > skip) ej = top; }
    if (ej) S.life[ej] = 'ejected';
    S.result = { ej, wasHacker: ej ? S.roles[ej] === 'hacker' : false, tie, skip, ranked, votes: Object.keys(S.meeting.votes).length, endsAt: t + 7000 };
    S.phase = 'result';
  },
  afterResult() {
    const S = this.S, t = Date.now();
    const r = S.result;
    S.meeting = null; S.result = null;
    if (r.ej && r.wasHacker) return this.finish('defenders', 'ejected');
    if (this.hackerAlive() && this.aliveDefenders() <= 1) return this.finish('hacker', 'parity');
    S.phase = 'play';
    S.spawn++;
    S.killReadyAt = t + S.settings.killCd * 1000;
    S.sabReadyAt = Math.max(S.sabReadyAt, t + 15000);
    this.placeBots();
  },
  finish(winner, reason) { const S = this.S; S.end = { winner, reason, at: Date.now() }; S.phase = 'end'; S.sab = null; S.meeting = null; },

  // ---- host controls ----
  addBot(quiet) {
    const S = this.S;
    if (S.phase !== 'lobby' || S.players.length >= MAX_PLAYERS) return;
    const used = new Set(S.players.map(p => p.name));
    const name = BOT_NAMES.find(n => !used.has(n)) || `Bot ${S.players.length + 1}`;
    S.players.push({ pid: 'bot-' + rid(6), name, bot: true, seat: S.players.length });
    if (!quiet) this.commit();
  },
  remove(pid) {
    const S = this.S;
    if (S.phase !== 'lobby') return;
    S.players = S.players.filter(p => p.pid !== pid);
    if (!pid.startsWith('bot-')) S.kicked[pid] = Date.now();
    this.reseat();
    this.commit();
  },
  setSetting(k, v) { if (this.S.phase === 'lobby') { this.S.settings[k] = v; this.commit(); } },
  start() {
    const S = this.S, n = S.players.length;
    if ((S.phase !== 'lobby' && S.phase !== 'end') || n < MIN_PLAYERS) return;
    const players = S.players, settings = S.settings, kicked = S.kicked;
    Object.assign(S, this.fresh(), { players, settings, kicked });
    S.gid = rid(8);
    const hacker = pick(players).pid;
    for (const p of players) {
      S.roles[p.pid] = p.pid === hacker ? 'hacker' : 'defender';
      S.life[p.pid] = 'alive';
      const byType = {};
      for (const st of shuffle(STATIONS)) if (!byType[st.t]) byType[st.t] = st;
      S.tasks[p.pid] = shuffle(Object.values(byType)).slice(0, S.settings.tasks).map(st => ({ st: st.id, done: false }));
      S.meetingsLeft[p.pid] = S.settings.meetings;
    }
    S.total = (n - 1) * S.settings.tasks;
    S.phase = 'reveal';
    S.revealEnds = Date.now() + 7000;
    S.spawn = (S.spawn || 0) + 1;
    this.bots = {};
    this.placeBots();
    this.commit();
  },
  backToLobby() {
    const S = this.S;
    const players = S.players, settings = S.settings, kicked = S.kicked;
    Object.assign(S, this.fresh(), { players, settings, kicked, gid: rid(8), phase: 'lobby' });
    this.bots = {};
    this.commit();
  },
  close() { this.S.phase = 'closed'; this.commit().then(() => this.stop('Game closed.')); },

  // ---- clock ----
  tick() {
    const S = this.S;
    if (!S) return;
    const t = Date.now();
    let changed = false;
    if (S.phase === 'reveal' && t >= S.revealEnds) { S.phase = 'play'; S.killReadyAt = t + S.settings.killCd * 1000; S.sabReadyAt = t + 20000; changed = true; }
    else if (S.phase === 'play' && S.sab && S.sab.endsAt && t >= S.sab.endsAt) { this.finish('hacker', 'firewall'); changed = true; }
    else if (S.phase === 'meeting' && t >= S.meeting.endsAt) { this.endMeeting(); changed = true; }
    else if (S.phase === 'result' && t >= S.result.endsAt) { this.afterResult(); changed = true; }
    if (this.botBrain(t)) changed = true;
    if (changed) this.commit();
  },

  // ---- practice bots ----
  placeBots() {
    for (const p of this.S.players) if (p.bot) {
      const b = this.bots[p.pid] || (this.bots[p.pid] = {});
      Object.assign(b, { pos: spawnPoint(p.seat), d: 1, m: 0, path: null, busyUntil: 0, next: Date.now() + 1500 + Math.random() * 3000, voteAt: 0, goal: null, fixAt: 0 });
    }
  },
  botBrain(t) {
    const S = this.S;
    let changed = false;
    const act = (pid, a) => { this.handle(pid, { ...a, gid: S.gid }); changed = true; };
    for (const p of S.players) {
      if (!p.bot) continue;
      const b = this.bots[p.pid];
      if (!b) continue;
      const role = S.roles[p.pid], alive = S.life[p.pid] === 'alive';
      if (S.phase === 'play') {
        if (alive) {
          const body = S.bodies.find(x => dist(b.pos, x) < VISION.crew);
          if (body && role === 'defender') {
            if (dist(b.pos, body) <= RANGE.report) { if (Math.random() < 0.15) act(p.pid, { t: 'report', body: body.pid }); continue; }
            if (!b.goal || b.goal.k !== 'body') this.goBot(b, { k: 'body', x: body.x, y: body.y });
            continue;
          }
          if (S.sab && role === 'defender') {
            const f = FIXES[S.sab.kind];
            if (dist(b.pos, f) <= RANGE.fix) { if (!b.fixAt) b.fixAt = t + 2500; if (t >= b.fixAt) { b.fixAt = 0; act(p.pid, { t: 'fix', kind: S.sab.kind }); } continue; }
            if ((!b.goal || b.goal.k !== 'fix') && Math.random() < 0.03) this.goBot(b, { k: 'fix', x: f.x, y: f.y - 0.9 });
          }
          if (role === 'hacker' && t >= S.killReadyAt) {
            const near = id => { const q = this.posOf(id); return q ? dist(q, b.pos) : 99; };
            const prey = S.players.filter(q => q.pid !== p.pid && S.life[q.pid] === 'alive' && near(q.pid) <= RANGE.kill);
            const witnesses = S.players.filter(q => q.pid !== p.pid && S.life[q.pid] === 'alive' && near(q.pid) <= 6);
            if (prey.length && witnesses.length <= 1 && Math.random() < 0.12) { act(p.pid, { t: 'kill', target: prey[0].pid }); continue; }
          }
          if (role === 'hacker' && !S.sab && t >= S.sabReadyAt && Math.random() < 0.004) act(p.pid, { t: 'sabotage', kind: Math.random() < 0.5 ? 'lights' : 'firewall' });
        }
        if (b.path) continue;
        if (b.goal && b.goal.k === 'task') {
          if (t < b.busyUntil) continue;
          const i = b.goal.i;
          b.goal = null; b.busyUntil = 0; b.next = t + 800 + Math.random() * 2500;
          act(p.pid, { t: 'task', i });
          continue;
        }
        if (t < b.next) continue;
        const open = (S.tasks[p.pid] || []).map((x, i) => ({ x, i })).filter(o => !o.x.done);
        if (open.length) { const o = pick(open); const st = STATION[o.x.st]; this.goBot(b, { k: 'task', i: o.i, x: st.x, y: st.y + 0.9 }); }
        else this.goBot(b, { k: 'wander', ...pick(ROOMS.map(r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 + 1.2 }))) });
        b.next = t + 3000;
      } else if (S.phase === 'meeting' && alive && S.meeting.votes[p.pid] == null && t >= S.meeting.voteFrom) {
        if (!b.voteAt) b.voteAt = t + 3000 + Math.random() * 15000;
        if (t >= b.voteAt) {
          const others = S.players.filter(x => x.pid !== p.pid && S.life[x.pid] === 'alive');
          let v = 'skip';
          if (role === 'hacker') { const d = others.filter(x => S.roles[x.pid] === 'defender'); if (d.length) v = pick(d).pid; }
          else if (others.length && Math.random() > 0.35) v = pick(others).pid;
          b.voteAt = 0;
          act(p.pid, { t: 'vote', target: v });
        }
      }
    }
    return changed;
  },
  goBot(b, goal) { b.goal = goal; b.path = route(b.pos, goal); },
  botStep() {
    const S = this.S;
    if (!S) return;
    if (S.phase === 'play') {
      const step = SPEED * 0.9 * 0.05;
      for (const p of S.players) {
        const b = p.bot && this.bots[p.pid];
        if (!b) continue;
        b.m = 0;
        if (!b.path || !b.path.length) continue;
        const wp = b.path[0];
        const dx = wp.x - b.pos.x, dy = wp.y - b.pos.y, L = Math.hypot(dx, dy);
        if (L <= step) {
          b.pos = { x: wp.x, y: wp.y };
          b.path.shift();
          if (!b.path.length) { b.path = null; if (b.goal && b.goal.k === 'task') b.busyUntil = Date.now() + 5000 + Math.random() * 6000; else if (b.goal && b.goal.k !== 'fix' && b.goal.k !== 'body') b.goal = null; }
        } else { b.pos = { x: b.pos.x + dx / L * step, y: b.pos.y + dy / L * step }; b.m = 1; if (Math.abs(dx) > 0.01) b.d = dx < 0 ? -1 : 1; }
      }
    }
    this.botPresence();
  },
  botPresence() {
    if (this.solo) return;
    const S = this.S, bots = {};

// ---- actions ----
function doUse() {
  const N = Local.near, priv = App.priv;
  if (!priv || !App.pub || App.pub.phase !== 'play' || Local.busy) return;
  if (N.fix) { const kind = N.fix; openGame(FIXES[kind].game, () => Player.send({ t: 'fix', kind }), { fix: true }); return; }
  if (N.task != null) { const i = N.task, st = STATION[priv.tasks[i].st]; openGame(st.t, () => { Player.send({ t: 'task', i }); markDone(i); }); return; }
  if (N.table) { if (confirmTap('button')) Player.send({ t: 'button' }); else toast('Tap Emergency again to call a War Room.'); }
}

}

  const i = Local.near.vent;

  const group = VENTS.filter(v => v.g === VENTS[i].g);
  const next = group[(group.indexOf(VENTS[i]) + 1) % group.length];
  Local.pos = { x: next.x, y: next.y + 0.8 };

}

// ---- drawing the phone view ----
function drawPhoneView(g, canvas, pub, priv, others, t) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scale = Math.min(W, H) / 8.5;
  const cx = Local.pos.x, cy = Local.pos.y;
  const X = x => (x - cx) * scale + W / 2, Y = y => (y - cy) * scale + H / 2;
  g.fillStyle = '#04060b'; g.fillRect(0, 0, W, H);
  g.drawImage(MAPIMG, (cx - W / 2 / scale) * MAP_PX, (cy - H / 2 / scale) * MAP_PX, W / scale * MAP_PX, H / scale * MAP_PX, 0, 0, W, H);
  const vis = visionOf(pub, priv);
  const ghost = priv.life !== 'alive';
  const pulse = 0.5 + 0.5 * Math.sin(t / 250);
  priv.tasks.forEach(tk => {
    if (tk.done) return;
    const s = STATION[tk.st];
    g.strokeStyle = `rgba(255, 220, 60, ${0.5 + 0.5 * pulse})`; g.lineWidth = 3;
    g.strokeRect(X(s.x - 0.7), Y(s.y - 0.6), 1.4 * scale, 1.2 * scale);
  });
  if (pub.sab) { const f = FIXES[pub.sab.kind]; g.strokeStyle = `rgba(255, 60, 80, ${0.4 + 0.6 * pulse})`; g.lineWidth = 4; g.strokeRect(X(f.x - 0.7), Y(f.y - 0.7), 1.4 * scale, 1.4 * scale); }
  const items = [];
  for (const b of pub.bodies) if (ghost || dist(b, Local.pos) <= vis) items.push({ y: b.y, draw: () => drawBody(g, X(b.x), Y(b.y), scale * 1.3, colorOf(playerBy(b.pid))) });
  for (const o of others) {
    if (!ghost && dist(o, Local.pos) > vis) continue;
    const bob = o.m ? Math.sin(t / 90) * scale * 0.04 : 0;
    items.push({ y: o.y, draw: () => { drawCrew(g, X(o.x), Y(o.y), scale * 1.3, colorOf(o.p), o.d, { bob }); nameTag(g, X(o.x), Y(o.y) - scale * 1.35, o.p.name, Math.max(12, scale * 0.36)); } });
  }
  const mine = me();
  items.push({ y: Local.pos.y, draw: () => {
    drawCrew(g, X(cx), Y(cy), scale * 1.3, colorOf(mine), Local.dir, { bob: Local.moving ? Math.sin(t / 90) * scale * 0.04 : 0, alpha: ghost ? 0.5 : 1 });
    nameTag(g, X(cx), Y(cy) - scale * 1.35, (mine || {}).name || 'You', Math.max(12, scale * 0.36), priv.role === 'hacker' ? '#ff6476' : '#fff');
  } });
  items.sort((a, b) => a.y - b.y).forEach(i => i.draw());
  if (!ghost) {
    const r = vis * scale;
    const grad = g.createRadialGradient(W / 2, H / 2, r * 0.72, W / 2, H / 2, r);
    grad.addColorStop(0, 'rgba(2,4,9,0)'); grad.addColorStop(1, 'rgba(2,4,9,0.94)');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
  }
}
function drawMinimap(canvas) {

        if (!still) { o.x += o.vx; o.y += o.vy; if (o.x < 0 || o.x > 1) { o.vx *= -1; o.x = clamp(o.x, 0, 1); } if (o.y < 0 || o.y > 1) { o.vy *= -1; o.y = clamp(o.y, 0, 1); } }
        o.el.style.transform = `translate(${o.x * W}px, ${o.y * H}px)`;
      }
      raf = requestAnimationFrame(loop);
    };
    loop();
    status.textContent = `Tap all ${N} pieces of malware.`;
    return () => cancelAnimationFrame(raf);
  },
  signal({ area, status, win }) {
    const canvas = h('canvas', { class: 'wave', width: '600', height: '220', 'aria-hidden': 'true' });
    const target = 2 + Math.floor(Math.random() * 5) + Math.random() * 0.5;
    const slider = h('input', { type: 'range', min: '1', max: '8', step: '0.05', value: String(target > 4.5 ? 1.3 : 7.6), 'aria-label': 'Signal frequency' });
    const meterEl = h('p', { class: 'muted', 'aria-live': 'polite' });
    area.append(canvas, slider, meterEl);
    const g = canvas.getContext('2d');
    let held = 0, last = performance.now(), raf = 0, phase = 0, done = false;
    const wave = (f, color, dash) => { g.beginPath(); g.setLineDash(dash ? [10, 8] : []); g.strokeStyle = color; g.lineWidth = 5; for (let x = 0; x <= 600; x += 4) { const y = 110 + Math.sin((x / 600) * Math.PI * 2 * f + phase) * 70; if (x) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke(); };
    const loop = t => {
      const dt = t - last; last = t; phase += dt / 400;
      const f = Number(slider.value), diff = Math.abs(f - target);
      g.clearRect(0, 0, 600, 220); wave(target, '#54e5ed', true); wave(f, diff < 0.18 ? '#43d16a' : '#ffcf5c', false);
      if (diff < 0.18) held += dt; else held = 0;
      meterEl.textContent = diff < 0.18 ? 'Aligned. Hold still…' : `Signal match: ${Math.round(clamp(1 - diff / 6, 0, 1) * 100)}%`;
      if (held > 1000 && !done) { done = true; win(); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    status.textContent = 'Slide until the waves line up, then hold.';
    return () => cancelAnimationFrame(raf);
  },
  file: holdGame({ text: 'Uploading payroll.xlsx to the server…', btn: 'Hold to transfer', need: 6000 }),
  scan: holdGame({ text: 'Scan your hand to stop the breach.', btn: 'Hold the scanner', need: 2500 }),
  verify({ area, status, win }) {
    const keys = [], pad = h('div', { class: 'keypad' });
    for (let i = 0; i < 9; i++) { const k = h('button', { class: 'key', 'aria-label': `Key ${i + 1}` }, String(i + 1)); keys.push(k); pad.append(k); }
    area.append(pad);
    const rounds = [3, 4, 5];
    let round = 0, seq = [], pos = 0, showing = false;
    const timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    const show = () => {
      showing = true; pos = 0; keys.forEach(k => { k.disabled = true; });
      status.textContent = `Round ${round + 1} of 3: watch.`;
      seq.forEach((n, i) => { later(() => keys[n].classList.add('lit'), 500 + i * 600); later(() => keys[n].classList.remove('lit'), 500 + i * 600 + 380); });
      later(() => { showing = false; keys.forEach(k => { k.disabled = false; }); status.textContent = 'Your turn: repeat it.'; say(`Sequence: ${seq.map(n => n + 1).join(', ')}`); keys[0].focus({ preventScroll: true }); }, 500 + seq.length * 600);
    };
    const next = () => { seq = Array.from({ length: rounds[round] }, () => Math.floor(Math.random() * 9)); show(); };
    keys.forEach((k, i) => k.addEventListener('click', () => {
      if (showing) return;
      if (seq[pos] === i) {
        k.classList.add('ok'); later(() => k.classList.remove('ok'), 160); pos++;
        if (pos === seq.length) { round++; if (round === rounds.length) { keys.forEach(x => { x.disabled = true; }); win(); } else later(next, 450); }
      } else { pad.classList.add('shake'); later(() => pad.classList.remove('shake'), 300); status.textContent = 'Wrong key. Watch again.'; later(show, 600); }
    }));
    next();
    return () => timers.forEach(clearTimeout);
  },
  reboot({ area, status, win }) {
    const grid = h('div', { class: 'keypad', style: 'grid-template-columns:repeat(2,1fr)' });
    let want = 1;
    for (const n of shuffle([1, 2, 3, 4])) {
      const b = h('button', { class: 'key', 'aria-label': `Node ${n}` }, String(n));
      b.addEventListener('click', () => { if (n !== want) { status.textContent = `Tap ${want} next.`; return; } b.classList.add('ok'); b.disabled = true; want++; if (want > 4) win(); });
      grid.append(b);
    }
    area.append(grid);
    return null;
  },
};

/* ---------- sound, screen, hosting ---------- */
let audio = null;
function beep(freq, dur, times = 1) {
  if (!App.ui.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + i * (dur + 0.08);
      o.frequency.value = freq; o.type = 'square';
      g.gain.setValueAtTime(0.06, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g).connect(audio.destination); o.start(at); o.stop(at + dur);
    }
  } catch (e) {}
}
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
function soloHere() { App.name = App.name || 'You'; Host.begin({ solo: true }); }

boot();
</script>
